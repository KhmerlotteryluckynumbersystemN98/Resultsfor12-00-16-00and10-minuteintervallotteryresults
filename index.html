      function $(id) { return document.getElementById(id); }

      function fixPhoneNumber(phone) {
        var p = String(phone || '').trim().replace(/[^0-9]/g, '');
        if (p.length >= 9 && p.charAt(0) !== '0') p = '0' + p;
        return p;
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function fmtAmount(v, cur) {
        if (cur === 'USD') return Number(v || 0).toFixed(2) + '$';
        return Math.round(v || 0).toLocaleString() + '៛';
      }
      function fmtTotal(v, cur) {
        if (cur === 'USD') return Number(v || 0).toFixed(2) + '$';
        return Number(v || 0).toLocaleString() + '៛';
      }
      function getReqLen() { return betType === 'two' ? 2 : 3; }
      function getReqLen10() { return betType10 === 'two' ? 2 : 3; }

      function buildDateFormats(d) {
        return [
          d.toLocaleDateString('km-KH'),
          d.toLocaleDateString('en-GB'),
          String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(),
          d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear()
        ];
      }

      function showConfirm(options, callback) {
        var modal = $('confirmModal');
        if (!modal) { 
          if (confirm(options.message)) callback(true);
          return;
        }
        $('confirmIcon').textContent = options.icon || '❓';
        $('confirmTitle').textContent = options.title || 'តើអ្នកប្រាកដឬ?';
        $('confirmMessage').textContent = options.message || '';
        $('confirmOkBtn').textContent = options.okText || '✓ បញ្ជាក់';
        $('confirmCancelBtn').textContent = options.cancelText || '✕ បោះបង់';
        
        var infoContainer = $('confirmInfoContainer');
        var infoBox = $('confirmInfoBox');
        if (options.infoRows && options.infoRows.length > 0) {
          infoContainer.style.display = 'block';
          var html = '';
          for (var i = 0; i < options.infoRows.length; i++) {
            var row = options.infoRows[i];
            var cls = row.isTotal ? 'total' : '';
            html += '<div class="confirm-info-row ' + cls + '">' +
              '<span class="label">' + esc(row.label) + '</span>' +
              '<span class="value">' + esc(row.value) + '</span>' +
            '</div>';
          }
          infoBox.innerHTML = html;
        } else {
          infoContainer.style.display = 'none';
        }
        
        confirmCallback = callback;
        modal.style.display = 'block';
      }

      function closeConfirm(result) {
        var modal = $('confirmModal');
        if (modal) modal.style.display = 'none';
        if (typeof confirmCallback === 'function') {
          var cb = confirmCallback;
          confirmCallback = null;
          cb(!!result);
        }
      }

      function showToast(message, type, icon) {
        type = type || 'info';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        if (!icon) icon = icons[type] || '🔔';
        var container = $('toastContainer');
        if (!container) return;
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.innerHTML = '<span class="toast-icon">' + icon + '</span><span class="toast-text">' + esc(message) + '</span>';
        container.appendChild(toast);
        setTimeout(function() {
          toast.style.animation = 'fadeIn 0.3s ease-out reverse';
          setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
        }, CFG.TOAST_DURATION);
      }

      function showLoading(show) {
        var el = $('loadingOverlay');
        if (el) el.classList.toggle('active', show);
      }

      function showAlert(title, msg, icon) {
        $('alertIcon').textContent = icon || '🔔';
        $('alertTitle').textContent = title;
        $('alertMessage').textContent = msg;
        $('alertModal').style.display = 'block';
      }
      function closeModal(id) {
        var el = $(id);
        if (el) el.style.display = 'none';
      }

      function toggleTheme() {
        var isDark = document.body.classList.toggle('dark-mode');
        try { localStorage.setItem(CFG.THEME_KEY, isDark ? 'dark' : 'light'); } catch (e) {}
        var btn = $('themeBtn');
        if (btn) {
          var label = btn.querySelector('.theme-label');
          if (label) label.textContent = isDark ? 'Light' : 'Dark';
          btn.childNodes[0].nodeValue = isDark ? '☀️ ' : '🌙 ';
        }
        showToast(isDark ? 'បានបើក Dark Mode' : 'បានបើក Light Mode', 'info', isDark ? '🌙' : '☀️');
      }

      function initTheme() {
        try {
          var saved = localStorage.getItem(CFG.THEME_KEY);
          if (saved === 'dark') {
            document.body.classList.add('dark-mode');
            var btn = $('themeBtn');
            if (btn) {
              var label = btn.querySelector('.theme-label');
              if (label) label.textContent = 'Light';
              btn.childNodes[0].nodeValue = '☀️ ';
            }
          }
        } catch (e) {}
      }

      function toggleSound() {
        soundEnabled = !soundEnabled;
        try { localStorage.setItem(CFG.SOUND_KEY, soundEnabled ? 'on' : 'off'); } catch (e) {}
        var btn = $('soundToggleBtn');
        if (btn) {
          if (soundEnabled) {
            btn.textContent = '🔊 សំឡេង';
            btn.classList.remove('muted');
          } else {
            btn.textContent = '🔇 សំឡេងបិទ';
            btn.classList.add('muted');
          }
        }
        showToast(soundEnabled ? 'បើកសំឡេង' : 'បិទសំឡេង', 'info', soundEnabled ? '🔊' : '🔇');
      }

      function initSound() {
        try {
          var saved = localStorage.getItem(CFG.SOUND_KEY);
          if (saved === 'off') {
            soundEnabled = false;
            var btn = $('soundToggleBtn');
            if (btn) { btn.textContent = '🔇 សំឡេងបិទ'; btn.classList.add('muted'); }
          }
        } catch (e) {}
      }

      function playBeep() {
        if (!soundEnabled) return;
        try {
          var a = beepAudio.cloneNode();
          a.volume = 0.8;
          a.play().catch(function(e) {});
        } catch (e) {}
      }

      function checkBeepBeforeDraw() {
        if (!soundEnabled) return;
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var s = now.getSeconds();
        
        if (h === 11 && m === 59 && s === 45) {
          if (lastBeepSlot12 !== '12_main') { lastBeepSlot12 = '12_main'; playBeep(); }
        }
        if (h === 15 && m === 59 && s === 45) {
          if (lastBeepSlot16 !== '16_main') { lastBeepSlot16 = '16_main'; playBeep(); }
        }
        if (m % 10 === 9 && s === 45) {
          var slot3 = 'r_' + m;
          if (lastBeepSlot10 !== slot3) { lastBeepSlot10 = slot3; playBeep(); }
        }
      }

      function initParticles() {
        var container = $('particlesBg');
        if (!container) return;
        var emojis = ['🎲', '💰', '🎯', '⭐', '🏆', '💎', '🎁', '🎰', '✨', '⚡', '🪙'];
        var count = window.innerWidth < 768 ? 10 : 16;
        for (var i = 0; i < count; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          p.style.left = Math.random() * 100 + '%';
          p.style.fontSize = (14 + Math.random() * 22) + 'px';
          p.style.animationDuration = (12 + Math.random() * 10) + 's';
          p.style.animationDelay = (Math.random() * 15) + 's';
          p.style.opacity = 0.15 + Math.random() * 0.2;
          container.appendChild(p);
        }
      }

      function fetchWithTimeout(url, options, timeoutMs) {
        timeoutMs = timeoutMs || CFG.FETCH_TIMEOUT;
        return new Promise(function(resolve, reject) {
          var timer = setTimeout(function() { reject(new Error('TIMEOUT')); }, timeoutMs);
          fetch(url, options)
            .then(function(res) { 
              clearTimeout(timer); 
              if (!res.ok) {
                console.error('HTTP Error:', res.status, res.statusText);
                reject(new Error('HTTP Error: ' + res.status));
                return;
              }
              resolve(res); 
            })
            .catch(function(err) { 
              clearTimeout(timer); 
              console.error('Fetch Error:', err);
              reject(err); 
            });
        });
      }

      function safeJsonParse(response) {
        return response.text().then(function(text) {
          try {
            return JSON.parse(text);
          } catch (e) {
            console.error('Invalid JSON Response:', text);
            throw new Error('ការឆ្លើយតបមិនត្រឹមត្រូវពី Server (Invalid JSON)។ សូមពិនិត្យ WEB_APP_URL ឬ Deploy ឡើងវិញ។');
          }
        });
      }

      let abortController = null;
      function fetchResults() {
        if (abortController) abortController.abort();
        abortController = new AbortController();
        fetchWithTimeout(WEB_APP_URL + '?action=getResults&limit=50&t=' + Date.now(), { 
          cache: 'no-store',
          signal: abortController.signal 
        })
        .then(safeJsonParse)
        .then(function(data) {
          if (data && data.ok && Array.isArray(data.results)) {
            cachedResults = data.results;
            updateResultsUI();
            if (currentHistoryTab === 'results-classic') renderHistoryTableClassic();
          }
        }).catch(function(e) { 
          if (e.name !== 'AbortError') console.error('fetchResults:', e); 
        });
      }

      function fetchUserWithdrawals() {
        if (!currentUser) return;
        var tbody = $('userWithdrawBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="color:#6c757d; padding:12px;"><span class="anim-spin">⏳</span> កំពុងផ្ទុក...</td></tr>';
        fetchWithTimeout(WEB_APP_URL + '?action=getWithdrawals&phone=' + encodeURIComponent(fixPhoneNumber(currentUser.phone)) + '&t=' + Date.now(), { cache: 'no-store' })
          .then(safeJsonParse)
          .then(function(data) {
            if (!tbody) return;
            if (!data.ok || !data.withdrawals || data.withdrawals.length === 0) {
              tbody.innerHTML = '<tr><td colspan="5" style="color:#6c757d; padding:12px; font-weight:600;">មិនមានប្រវត្តិ</td></tr>';

            var html = '';

              if (w.status === 'approved' || w.status === 'paid') badge = '<span class="status-badge status-approved">✅ បានអនុម័ត</span>';
              else if (w.status === 'rejected') badge = '<span class="status-badge status-rejected">❌ បដិសេធ</span>';
              
              var amtDisplay = w.withdrawAmount ? fmtAmount(w.withdrawAmount, w.currency) : (w.reward || '0');

                '<td><strong>' + esc(w.currency || 'USD') + '</strong></td>' +

        document.body.classList.toggle('tv-mode-active', isTVMode);

          for (var i = 0; i < betBoxes.length; i++) betBoxes[i].style.display = 'block';

            if ($('diceMode')) $('diceMode').style.display = 'none';
          } else {
            if ($('classicMode')) $('classicMode').style.display = 'none';
            if ($('rapidMode')) $('rapidMode').style.display = 'none';
            if ($('diceMode')) $('diceMode').style.display = 'block';
          }

      function manualCaptureScreenshot(timeSlot) {
        var targetId = timeSlot === '12:00' ? 'box12Container' : 'box16Container';
        var targetEl = $(targetId);
        if (!targetEl) return;
        
        if (typeof html2canvas === 'undefined') {
          showToast('html2canvas មិនទាន់ផ្ទុក', 'error');
          return;
        }
        
        showToast('កំពុងថតអេក្រង់...', 'info', '📸');
        
        html2canvas(targetEl, {
          backgroundColor: '#ffffff',
          scale: 2,
          useCORS: true,
          logging: false
        }).then(function(canvas) {
          var base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
          var caption = '📸 <b>លទ្ធផលឆ្នោត N98 - ' + timeSlot + ' (Manual)</b>\n📅 ' + new Date().toLocaleDateString('en-GB') + '\n⏰ ' + new Date().toLocaleTimeString('en-GB');
          
          fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'uploadScreenshot',
              imageBase64: base64,
              caption: caption,
              target: 'result'
            }),
            headers: { 'Content-Type': 'text/plain' }
          })
          .then(safeJsonParse)
          .then(function(data) {
            if (data.ok) showToast('ថតអេក្រង់ និងផ្ញើជោគជ័យ!', 'success', '📸');
            else showToast('បរាជ័យ: ' + (data.error || ''), 'error');
          })
          .catch(function(err) {
            console.error(err);
            showToast('មានបញ្ហាតភ្ជាប់!', 'error');
          });
        }).catch(function(err) {
          console.error(err);
          showToast('មានបញ្ហាក្នុងការថតអេក្រង់!', 'error');

      function updateHistoryTabsForMode(mode) {
        var tabs = document.querySelectorAll('.history-tab');
        var activeTab = null;
        
        for (var i = 0; i < tabs.length; i++) {
          var tabMode = tabs[i].getAttribute('data-mode');
          if (tabMode === 'both' || tabMode === mode) {
            tabs[i].style.display = 'flex';
            if (tabs[i].classList.contains('active')) activeTab = tabs[i];
          } else {
            tabs[i].style.display = 'none';
            tabs[i].classList.remove('active');
          }
        }
        
        if (!activeTab) {
          var firstTab = null;
          for (var j = 0; j < tabs.length; j++) {
            if (tabs[j].style.display !== 'none') { firstTab = tabs[j]; break; }
          }
          if (firstTab) {
            var tabName = firstTab.getAttribute('data-tab');
            switchHistoryTab(tabName, null);
          }
        }
      }

        intervals.dice = setInterval(function() {
          if (mainMode === 'dice') {
            N98.fetchDiceResults();
            var now = new Date();
            var sec = now.getSeconds();
            var min = now.getMinutes();
            var secondsIntoCycle = (min % 5) * 60 + sec;
            var secondsLeft = (5 * 60) - secondsIntoCycle;
            if (secondsLeft < 0) secondsLeft = 0;
            var mm = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
            var ss = String(secondsLeft % 60).padStart(2, '0');
            if ($('ringTimeDice')) $('ringTimeDice').textContent = mm + ':' + ss;
            
            var yy = String(now.getFullYear()).slice(-2);
            var startOfYear = new Date(now.getFullYear(), 0, 0);
            var dayOfYear = Math.floor((now - startOfYear) / 86400000);
            var slotIndex = Math.floor((now.getHours() * 60 + now.getMinutes()) / 5);
            currentDrawIdDice = yy + String(dayOfYear).padStart(3, '0') + String(slotIndex).padStart(3, '0');
            if ($('nextDrawNumberDice')) $('nextDrawNumberDice').textContent = '#' + currentDrawIdDice;
            
            var closedDice = secondsIntoCycle >= (5 * 60 - 10);
            if ($('bettingClosedBoxDice')) $('bettingClosedBoxDice').style.display = closedDice ? 'block' : 'none';
            if (closedDice) {
              var reopenSec = (5 * 60) - secondsIntoCycle;
              if ($('reopenTimeDice')) $('reopenTimeDice').textContent = '00:' + String(reopenSec).padStart(2, '0');
            }
            N98.updateSubmitDiceButton();
          }
        }, 1000);
        
        updateClock();
        updateCountdown10();
        
        var numInput = $('numInput');
        if (numInput && !numInput._bound) {
          numInput.addEventListener('input', autoAddNumbers);
          numInput._bound = true;
        }
        var numInput10 = $('numInput10');
        if (numInput10 && !numInput10._bound) {
          numInput10.addEventListener('input', autoAddNumbers10);
          numInput10._bound = true;
        }

        showSection('home', null);
        
        setTimeout(function() { N98.showPromoPopup(); }, 1500);
      }

      function autoAddNumbers() {
        var inp = $('numInput');
        var raw = inp.value.trim();
        if (!selectedLetter || !raw) return;
        var len = getReqLen();
        var digitsOnly = raw.replace(/[^0-9]/g, '');
        if (digitsOnly.length >= len && digitsOnly.length % len === 0) {
          for (var i = 0; i < digitsOnly.length; i += len) {
            var n = digitsOnly.substring(i, i + len);
            if (n.length !== len) continue;
            if (numbers.length >= CFG.MAX_NUMBERS) {
              showToast('ចាក់បានត្រឹម ' + CFG.MAX_NUMBERS + ' លេខ', 'warning');
              break;
            }
            var tag = selectedLetter + ':' + n;
            if (numbers.indexOf(tag) === -1) numbers.push(tag);
          }
          inp.value = '';
          updateDisplay();
        }
      }

      function removeNum(idx) {
        numbers.splice(idx, 1);
        updateDisplay();
      }

      function updateDisplay() {
        var container = $('selectedDisplay');
        var countEl = $('countDisplay');
        if (numbers.length === 0) {
          container.innerHTML = '<span style="color:#6c757d; font-size:12px; font-weight:600;">មិនទាន់មានលេខ</span>';
          countEl.textContent = '0';
        } else {
          var html = '';
          for (var i = 0; i < numbers.length; i++) {
            html += '<span class="selected-tag">' + esc(numbers[i]) +
                    ' <span class="remove" onclick="N98.removeNum(' + i + ')">&times;</span></span>';
          }
          container.innerHTML = html;
          countEl.textContent = numbers.length;
        }
        updateSummary();
      }

      function setAmount(val, sym) {
        $('amountInput').value = val;
        $('currencySelect').value = sym === '$' ? 'USD' : 'KHR';
        updateAmount();
      }

      function updateAmount() {
        var v = parseFloat($('amountInput').value);
        var c = $('currencySelect').value;
        amount = isNaN(v) || v <= 0 ? 0 : v;
        currency = c;
        updateSummary();
      }

      function updateSummary() {
        var cnt = numbers.length;
        if ($('totalCount')) $('totalCount').textContent = cnt;
        if ($('totalAmountDisplay')) $('totalAmountDisplay').textContent = fmtTotal(cnt * amount, currency);
        updateSubmitButton();
        updateBalanceStatusBox();
      }

      function updateSubmitButton() {
        var btn = $('btnSubmit');
        if (!btn) return;
        var isClosed = isBettingClosed(selectedTime);
        var cnt = numbers.length;
        var validAmount = currency === 'USD'
          ? (amount >= CFG.MIN_USD && amount <= CFG.MAX_USD)
          : (amount >= CFG.MIN_KHR && amount <= CFG.MAX_KHR);
        var total = cnt * amount;
        var balanceOk = currency === 'USD' ? balanceUSD >= total : balanceKHR >= total;
        var canSubmit = (cnt > 0 && validAmount && amount > 0 && balanceOk && !isClosed);
        btn.disabled = !canSubmit;
        if (canSubmit) {
          btn.style.background = 'linear-gradient(135deg,#28a745,#1e7e34)';
          btn.style.animation = 'glowGreen 2s ease-in-out infinite';
        } else {
          btn.style.animation = 'none';
        }
      }

      function updateBalanceStatusBox() {
        var box = $('balanceStatusBox');
        if (!box) return;
        var cnt = numbers.length;
        var total = cnt * amount;
        if (cnt === 0 || amount <= 0) {
          box.style.display = 'none';
          return;
        }
        box.style.display = 'block';
        var current = currency === 'USD' ? balanceUSD : balanceKHR;
        var needed = total;
        var short = Math.max(0, needed - current);
        var isEnough = current >= needed;
        var percent = needed > 0 ? Math.min(100, (current / needed) * 100) : 0;
        var fmt = function(v) {
          return currency === 'KHR' ? Math.round(v).toLocaleString() + '៛' : Number(v).toFixed(2) + '$';
        };
        if ($('balanceStatusCurrent')) $('balanceStatusCurrent').textContent = fmt(current);
        if ($('balanceStatusNeeded')) $('balanceStatusNeeded').textContent = fmt(needed);
        if (isEnough) {
          box.className = 'balance-status-box ok';
          if ($('balanceStatusIcon')) $('balanceStatusIcon').textContent = '✅';
          if ($('balanceStatusTitle')) $('balanceStatusTitle').textContent = 'សមតុល្យគ្រប់គ្រាន់!';
          if ($('balanceStatusShort')) { $('balanceStatusShort').textContent = fmt(0); $('balanceStatusShort').className = 'value success'; }
          if ($('balanceStatusHint')) {
            $('balanceStatusHint').textContent = '🎉 អ្នកអាចដាក់ភ្នាល់បាន!';
            $('balanceStatusHint').style.animation = 'none';
          }
          if ($('balanceProgressFill')) $('balanceProgressFill').style.width = '100%';
        } else {
          box.className = 'balance-status-box warn';
          if ($('balanceStatusIcon')) $('balanceStatusIcon').textContent = '⚠️';
          if ($('balanceStatusTitle')) $('balanceStatusTitle').textContent = 'សមតុល្យមិនគ្រប់គ្រាន់!';
          if ($('balanceStatusShort')) { $('balanceStatusShort').textContent = fmt(short); $('balanceStatusShort').className = 'value danger'; }
          if ($('balanceStatusHint')) {
            $('balanceStatusHint').textContent = '💡 សូមទាក់ទង Admin ដើម្បីបញ្ចូលប្រាក់';
            $('balanceStatusHint').style.animation = 'none';
          }
          if ($('balanceProgressFill')) $('balanceProgressFill').style.width = percent + '%';
        }
      }

      function submitBet() {
        if (isBettingClosed(selectedTime)) { showToast('ការចាក់ត្រូវបានបិទ!', 'warning', '🔒'); return; }
        if (numbers.length === 0) { showToast('សូមជ្រើសរើសលេខ!', 'warning'); return; }
        if (amount <= 0) { showToast('សូមបញ្ចូលចំនួនទឹកប្រាក់!', 'warning'); return; }
        var validAmount = currency === 'USD'
          ? (amount >= CFG.MIN_USD && amount <= CFG.MAX_USD)
          : (amount >= CFG.MIN_KHR && amount <= CFG.MAX_KHR);

        var total = numbers.length * amount;

      function isBettingClosed(timeSlot) {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        if (timeSlot === '12:00') {
          return (h > 12) || (h === 12) || (h === 11 && m >= 59);
        }
        if (timeSlot === '16:00') {
          return (h > 16) || (h === 16) || (h === 15 && m >= 59);
        }
        return false;
      }

      function updateBettingStatus() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var s = now.getSeconds();

        var closed12 = isBettingClosed('12:00');
        var closed16 = isBettingClosed('16:00');
        
        var box = $('bettingClosedCompact');
        var textEl = $('bettingClosedText');
        var countdownEl = $('reopenCountdown');

        if (closed12 || closed16) {
          if (box) box.style.display = 'flex';
          
          var nextOpenTime = new Date(now);
          nextOpenTime.setHours(24, 0, 0, 0);
          
          var closedText = '';

          if (closed12 && closed16) {
            closedText = 'ការចាក់ម៉ោង 12:00 និង 16:00 ត្រូវបានបិទជាបណ្ដោះអាសន្ន!';
          } else if (closed12) {
            closedText = 'ការចាក់ម៉ោង 12:00 ត្រូវបានបិទជាបណ្ដោះអាសន្ន!';
          } else if (closed16) {
            closedText = 'ការចាក់ម៉ោង 16:00 ត្រូវបានបិទជាបណ្ដោះអាសន្ន!';
          }

          if (textEl) textEl.textContent = closedText;
          
          if (nextOpenTime && countdownEl) {
            var diff = Math.floor((nextOpenTime - now) / 1000);
            if (diff > 0) {
              var hours = String(Math.floor(diff / 3600)).padStart(2, '0');
              var mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
              var secs = String(diff % 60).padStart(2, '0');
              countdownEl.textContent = hours + ':' + mins + ':' + secs;
            } else {
              countdownEl.textContent = '00:00:00';
            }
          }
        } else {
          if (box) box.style.display = 'none';
        }

        updateTimeButtons();
        updateSubmitButton();
        updateBalanceStatusBox();
      }

      function updateTimeButtons() {
        var btns = document.querySelectorAll('.time-selector .time-btn');
        var closed12 = isBettingClosed('12:00');

        for (var i = 0; i < btns.length; i++) {
          var dt = btns[i].getAttribute('data-time') || btns[i].textContent;
          var slot = '';
          if (dt.indexOf('12:00') !== -1) slot = '12:00';
          else if (dt.indexOf('16:00') !== -1) slot = '16:00';
          
          if (slot === '12:00' && closed12) btns[i].classList.add('closed');
          else if (slot === '16:00' && closed16) btns[i].classList.add('closed');
          else btns[i].classList.remove('closed');
        }

        if (closed12 && !closed16 && selectedTime === '12:00') {
          setTime('16:00', null);
        }
      }

      function autoAddNumbers10() {
        var inp = $('numInput10');
        var raw = inp.value.trim();
        if (!selectedLetter10 || !raw) return;
        var len = getReqLen10();
        var digitsOnly = raw.replace(/[^0-9]/g, '');
        if (digitsOnly.length >= len && digitsOnly.length % len === 0) {
          for (var i = 0; i < digitsOnly.length; i += len) {
            var n = digitsOnly.substring(i, i + len);
            if (n.length !== len) continue;
            if (numbers10.length >= CFG.MAX_NUMBERS) {
              showToast('ចាក់បានត្រឹម ' + CFG.MAX_NUMBERS + ' លេខ', 'warning');
              break;
            }
            var tag = selectedLetter10 + ':' + n;
            if (numbers10.indexOf(tag) === -1) numbers10.push(tag);
          }
          inp.value = '';
          updateDisplay10();
        }
      }

      function isBettingClosed10() {
        var now = new Date();
        var sec = now.getSeconds();
        var min = now.getMinutes();
        var secondsIntoCycle = (min % CFG.TENMIN_INTERVAL_MIN) * 60 + sec;
        var totalSeconds = CFG.TENMIN_INTERVAL_MIN * 60;
        var closeSeconds = CFG.TENMIN_CLOSE_SECONDS;
        return secondsIntoCycle >= (totalSeconds - closeSeconds);
      }

      function updateBettingClosed10() {

        if (box) box.style.display = closed ? 'block' : 'none';
        if (closed) {
          var now = new Date();

          var secondsIntoCycle = (min % CFG.TENMIN_INTERVAL_MIN) * 60 + sec;

          var mm = Math.floor(secondsLeft / 60);
          var ss = secondsLeft % 60;

      var RING_CIRCUMFERENCE = 2 * Math.PI * 70;

      function updateCountdown10() {
        var now = new Date();
        var min = now.getMinutes();
        var sec = now.getSeconds();
        var secondsIntoCycle = (min % CFG.TENMIN_INTERVAL_MIN) * 60 + sec;
        var totalSeconds = CFG.TENMIN_INTERVAL_MIN * 60;
        var secondsLeft = totalSeconds - secondsIntoCycle;
        var mm = Math.floor(secondsLeft / 60);
        var ss = secondsLeft % 60;

        if ($('ringTime')) $('ringTime').textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');

        var percent = secondsIntoCycle / totalSeconds;
        var offset = RING_CIRCUMFERENCE * percent;
        var ring = $('ringProgress');
        if (ring) ring.style.strokeDashoffset = offset;

        var yy = String(now.getFullYear()).slice(-2);
        var startOfYear = new Date(now.getFullYear(), 0, 0);
        var dayOfYear = Math.floor((now - startOfYear) / 86400000);
        var slotIndex = Math.floor((now.getHours() * 60 + now.getMinutes()) / CFG.TENMIN_INTERVAL_MIN);
        var drawNum = yy + String(dayOfYear).padStart(3, '0') + String(slotIndex).padStart(3, '0');

        var todayFormats = buildDateFormats(today);
        var yesterdayFormats = buildDateFormats(yesterday);

        var grouped = {};
        for (var i = 0; i < cachedResults.length; i++) {
          var r = cachedResults[i];
          var d = String(r.date || '').trim();
          var t = String(r.time || '').trim();
          var key = d + '|' + t;
          if (!grouped[key]) {
            grouped[key] = { date: d, time: t, two: null, three: null, publishedAt: '', isToday: false, isYesterday: false };
          }
          if (r.type === 'two') grouped[key].two = r;
          if (r.type === 'three') grouped[key].three = r;

          if (todayFormats.indexOf(d) !== -1) grouped[key].isToday = true;
          if (yesterdayFormats.indexOf(d) !== -1) grouped[key].isYesterday = true;
        }

        var arr = [];
        for (var k in grouped) {
          if (grouped.hasOwnProperty(k)) arr.push(grouped[k]);
        }
        arr.sort(function(a, b) {
          if (b.date !== a.date) return b.date.localeCompare(a.date);
          return (b.time || '').localeCompare(a.time || '');

      function updateClock() {
        var now = new Date();
        if ($('widgetTime')) $('widgetTime').textContent = now.toLocaleTimeString('km-KH', { hour12: false });
        if ($('widgetDate')) $('widgetDate').textContent = now.toLocaleDateString('km-KH', {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
        var h = now.getHours();
        var target = 12, label = '🕛 12:00';
        if (h >= 12 && h < 16) { target = 16; label = '🕓 16:00'; }
        else if (h >= 16) { target = 36; label = '🕛 12:00 រំលងយប់'; }
        var t = new Date(now);
        if (target === 36) { t.setDate(t.getDate() + 1); t.setHours(12, 0, 0, 0); }
        else t.setHours(target, 0, 0, 0);
        var diff = Math.floor((t - now) / 1000);
        var hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
        var mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        var secs = String(diff % 60).padStart(2, '0');
        if ($('countdownDisplay')) $('countdownDisplay').textContent = hrs + ':' + mins + ':' + secs;
        if ($('nextTimeLabel')) $('nextTimeLabel').textContent = '🎯 ពេលបន្ទាប់៖ ' + label;
        var sl = $('statusTimeLabel');
        if (sl) {
          if (h < 12) { sl.textContent = '⏳ រង់ចាំ 12:00'; sl.style.color = '#dc3545'; }
          else if (h >= 12 && h < 16) { sl.textContent = '⏳ រង់ចាំ 16:00'; sl.style.color = '#dc3545'; }
          else { sl.textContent = '✅ លទ្ធផលថ្ងៃនេះចេញហើយ!'; sl.style.color = '#28a745'; }
        }
        if (mainMode === 'rapid') updateCountdown10();
      }

            html += '<div class="dice-result-card' + (isNew ? ' new-result' : '') + '">' +
              '<div class="header">' +
                '<span class="draw-id">#' + esc(r.drawId) + '</span>' +
                '<span class="time">' + esc(r.time) + '</span>' +
              '</div>' +
              '<div style="text-align:center; padding:15px 0;">' +
                '<div style="font-size:40px; margin-bottom:5px;">' + emoji + '</div>' +
                '<div style="font-size:32px; font-weight:800; color:#d8b4fe;">' + r.result + '</div>' +
              '</div>' +
            '</div>';
          }
          grid.innerHTML = html;
        },
        setDiceType: function(type, evt) {
          diceTypeMode = type;
          var btns = document.querySelectorAll('#diceMode .type-btn');
          for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
          if (evt && evt.target) evt.target.classList.add('active');
          
          if (type === 'exact') {
            $('diceExactPanel').style.display = 'block';
            $('diceThinThickPanel').style.display = 'none';
          } else {
            $('diceExactPanel').style.display = 'none';
            $('diceThinThickPanel').style.display = 'block';
          }
        },
        toggleDiceSelection: function(val, evt) {
          var type = 'exact';
          var value = val;
          var label = '';
          if (val === 'thin') { type = 'thin'; label = 'ស្តើង (1,2,3)'; }
          else if (val === 'thick') { type = 'thick'; label = 'ក្រាស់ (4,5,6)'; }
          else { type = 'exact'; label = 'ទាយគ្រាប់ ' + val; }
          
          if (evt && evt.target) {
            var b = evt.target.closest('.dice-box');
            if (b) b.classList.toggle('active');
          }
          
          var idx = -1;
          for (var i = 0; i < diceSelectedOptions.length; i++) {
            if (diceSelectedOptions[i].type === type && diceSelectedOptions[i].value === value) {
              idx = i; break;
            }
          }
          if (idx >= 0) {
            diceSelectedOptions.splice(idx, 1);
            if (evt && evt.target) {
              var b2 = evt.target.closest('.dice-box');
              if (b2) b2.classList.remove('active');
            }
          } else {
            var inputAmt = parseFloat($('diceBetAmountInput').value);
            if (!inputAmt || inputAmt <= 0) {
              showToast('សូមបញ្ចូលចំនួនទឹកប្រាក់ជាមុនសិន!', 'warning');
              if (evt && evt.target) {
                var b3 = evt.target.closest('.dice-box');
                if (b3) b3.classList.remove('active');
              }
              return;
            }
            var cur = $('diceCurrencySelect').value;
            diceSelectedOptions.push({ type: type, value: value, amount: inputAmt, currency: cur, label: label });
          }
          
          N98.renderDiceSelectedList();
          N98.updateSubmitDiceButton();
        },
        addDiceSelectionToBet: function() {
          showToast('សូមជ្រើសរើសគ្រាប់ជាមុនសិន ដើម្បីបន្ថែមចូលបញ្ជី!', 'info');
        },
        removeDiceSelection: function(idx) {
          diceSelectedOptions.splice(idx, 1);
          var boxes = document.querySelectorAll('.dice-box');
          for (var i = 0; i < boxes.length; i++) boxes[i].classList.remove('active');
          for (var j = 0; j < diceSelectedOptions.length; j++) {
            var opt = diceSelectedOptions[j];
            var id = '';
            if (opt.type === 'exact') id = 'diceBox' + opt.value;
            else if (opt.type === 'thin') id = 'diceBoxThin';
            else if (opt.type === 'thick') id = 'diceBoxThick';
            var el = $(id);
            if (el) el.classList.add('active');
          }
          N98.renderDiceSelectedList();
          N98.updateSubmitDiceButton();
        },
        renderDiceSelectedList: function() {
          var el = $('diceSelectionList');
          if (!el) return;
          if (diceSelectedOptions.length === 0) {
            el.innerHTML = '<div class="dice-selection-empty">មិនទាន់មានជម្រើស</div>';
          } else {
            var html = '';
            var total = 0;
            for (var i = 0; i < diceSelectedOptions.length; i++) {
              var opt = diceSelectedOptions[i];
              total += opt.amount;
              html += '<span class="dice-selection-tag">' + esc(opt.label) + ' : ' + fmtAmount(opt.amount, opt.currency) +
                      ' <span class="remove" onclick="N98.removeDiceSelection(' + i + ')">&times;</span></span>';
            }
            el.innerHTML = html;
            if ($('diceTotalSelections')) $('diceTotalSelections').textContent = diceSelectedOptions.length;
            if ($('diceTotalAmount')) {
              var displayTotal = total.toFixed(2) + '$';
              var allKHR = true;
              for (var k = 0; k < diceSelectedOptions.length; k++) {
                if (diceSelectedOptions[k].currency !== 'KHR') { allKHR = false; break; }
              }
              if (allKHR) displayTotal = Math.round(total).toLocaleString() + '៛';
              $('diceTotalAmount').textContent = displayTotal;
            }
          }
          N98.updateSubmitDiceButton();
        },
        updateSubmitDiceButton: function() {
          var btn = $('btnSubmitDice'); if (!btn) return;
          var now = new Date(); var sec = now.getSeconds(); var min = now.getMinutes();
          var isClosed = ((min % 5) * 60 + sec) >= (5 * 60 - 10);
          var hasOptions = diceSelectedOptions.length > 0;
          var totalUSD = 0, totalKHR = 0;
          for (var i = 0; i < diceSelectedOptions.length; i++) {
            var opt = diceSelectedOptions[i];
            if (opt.currency === 'USD') totalUSD += opt.amount;
            else totalKHR += opt.amount;
          }
          var balanceOk = balanceUSD >= totalUSD && balanceKHR >= totalKHR;
          btn.disabled = !(hasOptions && balanceOk && !isClosed);
        },
        submitDiceBets: function() {
          if (diceSelectedOptions.length === 0) { showToast('សូមជ្រើសរើសជម្រើសចាក់!', 'warning'); return; }
          var now = new Date(); var sec = now.getSeconds(); var min = now.getMinutes();
          if (((min % 5) * 60 + sec) >= (5 * 60 - 10)) { showToast('ការចាក់ត្រូវបានបិទ (ចុងក្រោយ 10 វិនាទី)!', 'warning', '🔒'); return; }
          
          var totalUSD = 0, totalKHR = 0;
          for (var i = 0; i < diceSelectedOptions.length; i++) {
            var opt = diceSelectedOptions[i];
            if (opt.currency === 'USD') totalUSD += opt.amount;
            else totalKHR += opt.amount;
          }
          if (balanceUSD < totalUSD) { showToast('សមតុល្យ USD មិនគ្រប់គ្រាន់!', 'error', '💰'); return; }
          if (balanceKHR < totalKHR) { showToast('សមតុល្យ KHR មិនគ្រប់គ្រាន់!', 'error', '💰'); return; }
          
          var infoRows = [];
          for (var j = 0; j < diceSelectedOptions.length; j++) {
            var o = diceSelectedOptions[j];
            infoRows.push({ label: '🎲 ' + o.label, value: fmtAmount(o.amount, o.currency) });
          }
          var totalDisplay = '';
          if (totalUSD > 0) totalDisplay += totalUSD.toFixed(2) + '$ ';
          if (totalKHR > 0) totalDisplay += totalKHR.toLocaleString() + '៛';
          infoRows.push({ label: '💰 សរុប', value: totalDisplay.trim(), isTotal: true });
          
          showConfirm({
            icon: '🎲',
            title: 'បញ្ជាក់ការចាក់អាប៉ោង',
            message: 'តើអ្នកប្រាកដជាចង់ដាក់ភ្នាល់ឬ?',
            infoRows: infoRows,
            okText: '✓ បញ្ជាក់',
            cancelText: '✕ បោះបង់'
          }, function(confirmed) {
            if (!confirmed) return;
            var btn = $('btnSubmitDice');
            btn.disabled = true; btn.innerHTML = '<span class="anim-spin">⏳</span> កំពុងបញ្ជូន...'; showLoading(true);
            var betsArray = [];
            for (var k = 0; k < diceSelectedOptions.length; k++) {
              var op = diceSelectedOptions[k];
              betsArray.push({ type: op.type, value: op.value, amount: op.amount, currency: op.currency });
            }
            fetchWithTimeout(WEB_APP_URL, { 
              method: 'POST', 
              body: JSON.stringify({ action: 'placeDiceBet', phone: fixPhoneNumber(currentUser.phone), userId: currentUser.userId, bets: betsArray, drawId: currentDrawIdDice }), 
              headers: { 'Content-Type': 'text/plain' } 
            })
            .then(safeJsonParse).then(function(data) {
              btn.disabled = false; btn.innerHTML = '🎲 ដាក់ភ្នាល់ឥឡូវ'; showLoading(false);
              if (data.ok) { 
                showToast('ការចាក់អាប៉ោងត្រូវបានទទួលយក!', 'success', '🎉'); 
                diceSelectedOptions = []; 
                var boxes = document.querySelectorAll('.dice-box'); 
                for (var i=0; i<boxes.length; i++) boxes[i].classList.remove('active'); 
                N98.renderDiceSelectedList();
                fetchBalance(currentUser.phone); 
                N98.updateSubmitDiceButton(); 
              }
              else showToast(data.error || 'មានបញ្ហា!', 'error');
            }).catch(function(err) { 
              console.error(err); btn.disabled = false; btn.innerHTML = '🎲 ដាក់ភ្នាល់ឥឡូវ'; showLoading(false); showToast('មានបញ្ហាតភ្ជាប់!', 'error'); 
            });
          });
        },
        showPromoPopup: function() {
          if (hasShownPromoPopup) return; var modal = $('promoModal'); if (!modal) return;
          modal.style.display = 'flex'; hasShownPromoPopup = true;
          var timer = setInterval(function() {
            var now = new Date(); var h = now.getHours(); var m = now.getMinutes(); var s = now.getSeconds();
            var t12 = new Date(now); t12.setHours(12, 0, 0, 0); if (h >= 12) t12.setDate(t12.getDate() + 1);
            var diff12 = Math.floor((t12 - now) / 1000); if (diff12 < 0) diff12 = 0;
            if ($('promoCountdown12')) $('promoCountdown12').textContent = String(Math.floor(diff12 / 3600)).padStart(2, '0') + ':' + String(Math.floor((diff12 % 3600) / 60)).padStart(2, '0') + ':' + String(diff12 % 60).padStart(2, '0');
            var t16 = new Date(now); t16.setHours(16, 0, 0, 0); if (h >= 16) t16.setDate(t16.getDate() + 1);
            var diff16 = Math.floor((t16 - now) / 1000); if (diff16 < 0) diff16 = 0;
            if ($('promoCountdown16')) $('promoCountdown16').textContent = String(Math.floor(diff16 / 3600)).padStart(2, '0') + ':' + String(Math.floor((diff16 % 3600) / 60)).padStart(2, '0') + ':' + String(diff16 % 60).padStart(2, '0');
            var secondsIntoCycle = (m % 10) * 60 + s; var secondsLeft10 = (10 * 60) - secondsIntoCycle; if (secondsLeft10 < 0) secondsLeft10 = 0;
            if ($('promoCountdown10')) $('promoCountdown10').textContent = String(Math.floor(secondsLeft10 / 60)).padStart(2, '0') + ':' + String(secondsLeft10 % 60).padStart(2, '0');
          }, 1000); modal._timer = timer;
        },
        closePromoPopup: function() { var modal = $('promoModal'); if (modal) { modal.style.display = 'none'; if (modal._timer) clearInterval(modal._timer); } },
        toggleTheme: toggleTheme,
        toggleSound: toggleSound,
        toggleTVMode: toggleTVMode,
        showToast: showToast,
        setType10: setType10,
        selectLetter10: selectLetter10,
        removeNum10: removeNum10,
        setAmount10: setAmount10,
        updateAmount10: updateAmount10,
        submitBet10: submitBet10,
        adminQuickAdd: adminQuickAdd,
        adminAddDeposit: adminAddDeposit,
        adminLoadStats: adminLoadStats,
        adminLoadWithdrawals: adminLoadWithdrawals,
        adminApproveWithdraw: adminApproveWithdraw,
        adminRejectWithdraw: adminRejectWithdraw,
        adminLoadDepositRequests: adminLoadDepositRequests,
        adminApproveDepositReq: adminApproveDepositReq,
        adminRejectDepositReq: adminRejectDepositReq,
        manualCaptureScreenshot: manualCaptureScreenshot,
        closeConfirm: closeConfirm,
        updateBalanceUI: updateBalanceUI,
        downloadQR: downloadQR,
        enableScreenshotUpload: enableScreenshotUpload,
        checkContinueButtonState: checkContinueButtonState
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }

    })();
  </script>
</body>
</html>
